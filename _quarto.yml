project:
  type: book
  output-dir: docs
  resources:
  - results/synthetic/figures/*.png
book:
  title: AI-Assisted Metagenomics Analysis
  subtitle: From metagenomics profiles to an output you understand and can defend
  author: Teresia Mrema Buza | Complex Data Insights
  chapters:
  - index.qmd
  - part: Required setup
    chapters:
    - 00-setup.qmd
  - part: Synthetic practice
    chapters:
    - examples/synthetic/00-start-here.qmd
    - examples/synthetic/01-see-the-result.qmd
    - examples/synthetic/02-meet-the-data.qmd
    - examples/synthetic/03-check-the-inputs.qmd
    - examples/synthetic/04-run-the-analysis.qmd
    - examples/synthetic/05-verify-and-explain.qmd
    - examples/synthetic/06-export-the-report.qmd
  - part: "Hypertension case study \u2014 preparation"
    chapters:
    - examples/hypertension/00-start-here.qmd
    - examples/hypertension/01-see-the-result.qmd
    - examples/hypertension/02-meet-the-data.qmd
    - examples/hypertension/03-check-the-inputs.qmd
    - examples/hypertension/04-run-the-analysis.qmd
    - examples/hypertension/05-verify-and-explain.qmd
    - examples/hypertension/06-export-the-report.qmd
  - part: Your own study
    chapters:
    - examples/my-study/00-start-here.qmd
    - examples/my-study/01-see-the-result.qmd
    - examples/my-study/02-meet-the-data.qmd
    - examples/my-study/03-check-the-inputs.qmd
    - examples/my-study/04-run-the-analysis.qmd
    - examples/my-study/05-verify-and-explain.qmd
    - examples/my-study/06-export-the-report.qmd
  appendices:
  - 99-appendix.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    anchor-sections: true
    link-external-icon: true
    css: assets/css/cdi.css
    code-fold: false
    code-summary: Show code
    code-tools: false
    smooth-scroll: true
    mermaid:
      theme: forest
execute:
  echo: true
  eval: false
  warning: false
  message: false
  freeze: auto
  working-dir: .
